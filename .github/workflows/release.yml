name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app + NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Stage portable folder
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $stage = "portable/My Hero Manager $version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/mh-manager.exe" $stage
          Copy-Item -Recurse "tools" "$stage/tools"

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files\7-Zip\7z.exe" a -tzip "MyHeroManager_${version}_portable_x64.zip" "portable/My Hero Manager $version"

      - name: Rename installer asset
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in src-tauri/target/release/bundle/nsis/" }
          Copy-Item $installer.FullName "MyHeroManager_${version}_x64-setup.exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MyHeroManager_*-setup.exe
            MyHeroManager_*_portable_x64.zip
          generate_release_notes: true

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name'
          if ($assets -notlike '*-setup.exe') { throw 'Installer missing from published release!' }
          if ($assets -notlike '*_portable_x64.zip') { throw 'Portable zip missing from published release!' }
